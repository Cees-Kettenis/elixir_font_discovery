name: Build precompiled NIFs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-release:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        nif: ["2.15"]
        job:
          - {target: aarch64-apple-darwin, os: macos-15}
          - {target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm}
          - {target: x86_64-apple-darwin, os: macos-15-intel}
          - {target: x86_64-pc-windows-gnu, os: windows-2022}
          - {target: x86_64-pc-windows-msvc, os: windows-2022}
          - {target: x86_64-unknown-linux-gnu, os: ubuntu-22.04}
    steps:
      - uses: actions/checkout@v6

      - name: Read project version
        shell: bash
        run: |
          version=$(sed -n 's/^[[:space:]]*@version "\([^"]*\)"/\1/p' mix.exs | head -n 1)
          echo "PROJECT_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Install Linux font dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev libfreetype6-dev pkg-config

      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          target: ${{ matrix.job.target }}

      - name: Build native archive
        id: build-crate
        shell: bash
        env:
          NIF_VERSION: ${{ matrix.nif }}
          TARGET: ${{ matrix.job.target }}
        run: |
          cargo build \
            --locked \
            --manifest-path native/elixir_font_discovery/Cargo.toml \
            --release \
            --target "${TARGET}"

          output_dir="native/elixir_font_discovery/target/${TARGET}/release"

          case "${TARGET}" in
            *-apple-*)
              source_name="libelixir_font_discovery.dylib"
              library_name="libelixir_font_discovery-v${PROJECT_VERSION}-nif-${NIF_VERSION}-${TARGET}.so"
              ;;
            *-pc-windows-*)
              source_name="elixir_font_discovery.dll"
              library_name="elixir_font_discovery-v${PROJECT_VERSION}-nif-${NIF_VERSION}-${TARGET}.dll"
              ;;
            *)
              source_name="libelixir_font_discovery.so"
              library_name="libelixir_font_discovery-v${PROJECT_VERSION}-nif-${NIF_VERSION}-${TARGET}.so"
              ;;
          esac

          archive_name="${library_name}.tar.gz"
          cp "${output_dir}/${source_name}" "${output_dir}/${library_name}"
          tar -czf "${archive_name}" -C "${output_dir}" "${library_name}"
          echo "file-name=${archive_name}" >> "${GITHUB_OUTPUT}"
          echo "file-path=${archive_name}" >> "${GITHUB_OUTPUT}"

      - uses: actions/attest@v4
        with:
          subject-path: ${{ steps.build-crate.outputs.file-path }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build-crate.outputs.file-name }}
          path: ${{ steps.build-crate.outputs.file-path }}

      - name: Attach archive to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build-crate.outputs.file-path }}
